name: Release PROD IG

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ig-release
  cancel-in-progress: false

jobs:

  release:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: |
          npm install -g fsh-sushi
          gem install jekyll bundler
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Build IG
        run: |
          sushi .
          java -jar input-cache/publisher.jar ig.ini

      - name: Verify FHIR Package
        run: |
          if [ ! -f output/package.tgz ]; then
            echo "❌ package.tgz missing - invalid IG build"
            exit 1
          fi

      - name: Generate SHA256 checksum
        run: |
          cd output
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt

      - name: Upload IG Package
        uses: actions/upload-artifact@v4
        with:
          name: ig-package
          path: output/package.tgz


      - name: Prepare gh-pages branch
        run: |
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

      - name: Publish version
        run: |
          VERSION=${{ steps.v.outputs.version }}
          mkdir -p ".gh-pages/$VERSION"
          rsync -a output/ ".gh-pages/$VERSION/"

      - name: Update /current
        run: |
          VERSION=${{ steps.v.outputs.version }}

          mkdir -p ".gh-pages/current"

          cat > ".gh-pages/current/index.html" <<EOF
          <html>
            <meta http-equiv="refresh" content="0; url=../$VERSION/">
          </html>
          EOF

      - name: Update rollback registry
        run: |
          VERSION=${{ steps.v.outputs.version }}
          FILE="rollback.json"

          if [ ! -f "$FILE" ]; then
            echo "[]" > $FILE
          fi

          TMP=$(mktemp)

          jq ". += [{version: \"$VERSION\", date: \"$(date -Iseconds)\", active: true}]
              | map(.active = (.version == \"$VERSION\"))" $FILE > $TMP

          mv $TMP $FILE

      - name: Commit gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Release ${{ steps.v.outputs.version }}" || exit 0
          git push origin gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PH Core IG ${{ steps.v.outputs.version }}"
          files: output/package.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

