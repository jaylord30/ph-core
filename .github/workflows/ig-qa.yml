name: IG QA

on:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:

      - name: Download IG Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Validate IG Output Exists
        run: |
          set -euo pipefail

          if [ ! -d "output" ]; then
            echo "::error::Missing output directory"
            exit 1
          fi

          if [ ! -f "output/package.tgz" ]; then
            echo "::error::Missing IG package.tgz"
            exit 1
          fi

          echo "✅ IG output validated"

      - name: Locate QA file
        run: |
          set -euo pipefail

          if [ -f "output/qa.json" ]; then
            echo "QA_FILE=output/qa.json" >> $GITHUB_ENV
          elif [ -f "output/qa.html" ]; then
            echo "::warning::qa.json not found, falling back to qa.html"
            echo "QA_FILE=output/qa.html" >> $GITHUB_ENV
          else
            echo "::error::No QA file found"
            exit 1
          fi

      - name: QA Gate (Strict Fail)
        if: env.QA_FILE == 'output/qa.json'
        run: |
          set -euo pipefail

          ERROR_COUNT=$(jq -r '
            (.issues // .issue // [])
            | map(select(.severity? == "error"))
            | length
          ' "$QA_FILE")

          echo "FHIR IG QA ERROR COUNT: $ERROR_COUNT"

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::FHIR IG QA FAILED ($ERROR_COUNT errors)"
            exit 1
          fi

          echo "✅ QA PASSED"

      - name: QA HTML fallback check
        if: env.QA_FILE == 'output/qa.html'
        run: |
          echo "::warning::Using qa.html — consider enabling structured QA JSON export"
          grep -i "error" output/qa.html || echo "No visible errors found in HTML"

      - name: QA Detailed Breakdown
        if: failure() && env.QA_FILE == 'output/qa.json'
        run: |
          jq -r '
            (.issues // .issue // [])
            | map(select(.severity? == "error"))
            | group_by(.file // .source // .location // "UNKNOWN")
            | .[]
            | "❌ FILE: \(.[0].file // .[0].source // .[0].location)\n   COUNT: \(length)\n   SAMPLE:\n   - " + (map(.message)[0:5] | join("\n   - ")) + "\n"
          ' "$QA_FILE"

      - name: QA Root Cause Summary
        if: failure() && env.QA_FILE == 'output/qa.json'
        run: |
          jq -r '
            def issues: (.issues // .issue // []);

            {
              terminology: (issues | map(select(.message | test("ValueSet|CodeSystem|terminology|TX"; "i"))) | length),
              structure: (issues | map(select(.message | test("snapshot|cardinality|constraint"; "i"))) | length),
              profile: (issues | map(select(.message | test("Profile|Invariant"; "i"))) | length),
              config: (issues | map(select(.message | test("ImplementationGuide|canonical|dependency"; "i"))) | length)
            }
            | "Terminology: \(.terminology)\nStructure: \(.structure)\nProfile: \(.profile)\nConfig: \(.config)\n"
          ' "$QA_FILE"

      - name: Full Error List
        if: failure() && env.QA_FILE == 'output/qa.json'
        run: |
          jq -r '
            (.issues // .issue // [])
            | map(select(.severity? == "error"))
            | .[]
            | "FILE: \(.file // .source // .location // "UNKNOWN") | MESSAGE: \(.message)"
          ' "$QA_FILE"