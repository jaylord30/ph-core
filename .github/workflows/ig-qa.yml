name: IG QA

on:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Download IG Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Validate QA File Exists
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          if [ ! -f "$QA_FILE" ]; then
            echo "::error::qa.json missing at $QA_FILE"
            exit 1
          fi

      - name: IG QA File-Level Breakdown
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          echo "======================================"
          echo "FHIR IG QA - FILE LEVEL ERROR REPORT"
          echo "======================================"

          # Extract all error issues with file context
          jq -r '
            (.issues // .issue // .details.issues // [])
            | map(select(.severity? == "error"))
            | group_by(.file // .source // .location // "UNKNOWN")
            | .[]
            | {
                file: (.[0].file // .[0].source // .[0].location // "UNKNOWN"),
                count: length,
                messages: map(.message)
              }
            | "❌ FILE: \(.file)\n   ERROR COUNT: \(.count)\n   SAMPLE ERRORS:\n   - " + (.messages[0:5] | join("\n   - ")) + "\n"
          ' "$QA_FILE" || true

      - name: Full Error List (Debug)
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          echo "======================================"
          echo "FULL ERROR BREAKDOWN (RAW)"
          echo "======================================"

          jq -r '
            (.issues // .issue // .details.issues // [])
            | map(select(.severity? == "error"))
            | .[]
            | "FILE: \(.file // .source // .location // "UNKNOWN") | MESSAGE: \(.message)"
          ' "$QA_FILE" || true

      - name: QA Gate (FAIL IF ERRORS EXIST)
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          ERROR_COUNT=$(jq -r '
            (.issues // .issue // .details.issues // [])
            | map(select(.severity? == "error"))
            | length
          ' "$QA_FILE")

          echo "Total IG Errors: $ERROR_COUNT"

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::FHIR IG QA FAILED - $ERROR_COUNT errors found"
            exit 1
          fi

          echo "✅ IG QA PASSED - No errors found"