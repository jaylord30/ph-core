name: IG QA

on:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Download IG Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Validate QA File Exists
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          if [ ! -f "$QA_FILE" ]; then
            echo "::error::qa.json missing at $QA_FILE"
            exit 1
          fi

      - name: Parse QA Results (Summary + Debug)
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          echo "===================="
          echo "IG QA SUMMARY"
          echo "===================="

          ERRORS=$(jq -r '(.errs // .errors // 0)' "$QA_FILE")
          WARNINGS=$(jq -r '(.warnings // 0)' "$QA_FILE")
          HINTS=$(jq -r '(.hints // 0)' "$QA_FILE")

          echo "QA Errors: $ERRORS"
          echo "QA Warnings: $WARNINGS"
          echo "QA Hints: $HINTS"
          echo ""

          echo "===================="
          echo "SAMPLE ISSUES (first 10)"
          echo "===================="

          jq -c '(.issues // .issue // .details.issues // []) | .[0:10]' "$QA_FILE" || true

          echo ""

          echo "===================="
          echo "FULL ERROR BREAKDOWN"
          echo "===================="

          jq -c '
            (.issues // .issue // .details.issues // [])
            | map(select(.severity? == "error"))
          ' "$QA_FILE" || true

      - name: QA Gate (STRICT ERROR CHECK)
        run: |
          set -euo pipefail

          QA_FILE="output/qa.json"

          ERROR_COUNT=$(jq -r '
            (.issues // .issue // .details.issues // [])
            | map(select(.severity? == "error"))
            | length
          ' "$QA_FILE")

          echo "Detected ERROR_COUNT: $ERROR_COUNT"

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::IG QA failed with $ERROR_COUNT errors"
            exit 1
          fi

          echo "✅ IG QA PASSED (0 errors)"