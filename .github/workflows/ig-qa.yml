name: IG QA

on:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Download IG Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output
          
      - name: QA Gate
        run: |
          if [ ! -f output/qa.json ]; then
            echo "::error::No qa.json found in output/. Failing for safety."
            exit 1
          fi

          echo "📄 Printing qa.json for inspection..."
          cat output/qa.json
          
          ERRORS=$(jq -r '.errs // 0' output/qa.json)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::QA errors found: $ERRORS"
            exit 1
          fi
          echo "✅ QA passed: $ERRORS errors"
