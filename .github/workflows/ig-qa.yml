name: IG QA

on:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Download IG Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Validate QA File Exists
        run: |
          set -euo pipefail

          if [ ! -f output/qa.json ]; then
            echo "::error::qa.json missing"
            exit 1
          fi

      - name: Parse QA Results
        run: |
          set -euo pipefail

          # Safely extract values (default to 0 if missing/null)
          ERRORS=$(jq -r '.errs // 0' output/qa.json)
          WARNINGS=$(jq -r '.warnings // 0' output/qa.json)

          echo "===================="
          echo "IG QA SUMMARY"
          echo "===================="
          echo "QA Errors: $ERRORS"
          echo "QA Warnings: $WARNINGS"
          echo ""

          # Optional: show first issues for visibility
          echo "===================="
          echo "SAMPLE ISSUES"
          echo "===================="
          jq '.issues[0:10] // []' output/qa.json || true

          echo ""

          # Fail pipeline if errors exist
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::IG QA failed with $ERRORS errors"

            echo ""
            echo "===================="
            echo "FULL ERROR BREAKDOWN"
            echo "===================="

            jq '.issues[] | select(.severity=="error")' output/qa.json || true

            exit 1
          fi

          echo "QA passed successfully"