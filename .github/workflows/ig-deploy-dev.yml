name: Deploy Dev (GitHub Pages)

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Prepare dev site
        run: |
          rm -rf .publish
          mkdir -p .publish/dev

          rsync -a output/ .publish/dev/

          # store metadata (important upgrade)
          echo "{
            \"build\": \"dev\",
            \"timestamp\": \"$(date -Iseconds)\",
            \"sha\": \"${GITHUB_SHA}\"
          }" > .publish/dev/build-metadata.json

      - name: Create index
        run: |
          cat > .publish/index.html <<EOF
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>FHIR IG Dev</title>
          </head>
          <body>
            <h1>FHIR IG Development Build</h1>

            <p>
              Latest development build:
              <a href="./dev/">Open Dev IG</a>
            </p>

            <p>
              Build SHA: ${GITHUB_SHA}
            </p>

          </body>
          </html>
          EOF

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "dev: publish build ${GITHUB_SHA}"