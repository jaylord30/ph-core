name: IG Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx6g"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install jekyll bundler
          npm install -g fsh-sushi
          sudo apt-get update
          sudo apt-get install -y graphviz jq

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL \
            https://github.com/HL7/fhir-ig-publisher/releases/download/latest/publisher.jar \
            -o input-cache/publisher.jar

      - name: Run SUSHI
        run: |
          set -euo pipefail
          sushi . --log-level info

      - name: Run IG Publisher
        run: |
          set -euo pipefail
          java -jar input-cache/publisher.jar \
            -ig . \
            -tx https://tx.fhir.org/fhir \
            -cachedir ~/.fhir/packages \
            -txCache input-cache/txcache

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('fs').readFileSync('sushi-config.yaml','utf8')
            .match(/version:\s*([0-9A-Za-z\.\-]+)/)[1]")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate output
        run: |
          test -f output/package.tgz || (echo "Missing package.tgz" && exit 1)

      - name: Build registry
        run: |
          mkdir -p registry

          cp output/package.tgz registry/fhir.ph.core-${VERSION}.tgz

          cat > registry/package-list.json <<EOF
          {
            "package-id": "fhir.ph.core",
            "canonical": "http://doh.gov.ph/fhir/ph-core",
            "list": [
              {
                "version": "${VERSION}",
                "status": "ci-build",
                "current": true,
                "date": "$(date -Iseconds)",
                "path": "fhir.ph.core-${VERSION}.tgz"
              }
            ]
          }
          EOF

      - name: Build metadata
        run: |
          cat > registry/build-metadata.json <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "version": "${VERSION}",
            "timestamp": "$(date -Iseconds)"
          }
          EOF

      - name: Upload IG Output
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Upload Registry (for deploy)
        uses: actions/upload-artifact@v4
        with:
          name: ig-registry
          path: registry