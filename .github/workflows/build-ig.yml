name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]
#  pull_request:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  RUBY_VERSION: "3.2"
  IG_PUBLISHER_VERSION: "2.2.5"
  TX_SERVER: "https://tx.fhir.org"

jobs:
  gold-build:
    name: Gold Mode IG Build (Non-blocking validation)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Install SUSHI
      run: npm install -g fsh-sushi

    - name: Download IG Publisher
      run: |
        mkdir -p input-cache
        curl -fsSL \
          https://github.com/HL7/fhir-ig-publisher/releases/download/${IG_PUBLISHER_VERSION}/publisher.jar \
          -o input-cache/publisher.jar

    - name: Light cleanup (KEEP cache for "gold behavior")
      run: |
        rm -rf output temp input-cache
        mkdir -p ~/.fhir/packages

    - name: Run SUSHI (non-blocking)
      run: sushi . --log-level info || true

    - name: Preload IG dependencies (soft mode)
      run: |
        java -jar input-cache/publisher.jar \
          -ig . \
          -tx $TX_SERVER \
          -cachedir ~/.fhir/packages \
          -update || true

    - name: Build IG (Gold mode - non-fatal validation)
      run: |
        java -jar input-cache/publisher.jar \
          -ig . \
          -tx $TX_SERVER \
          -cachedir ~/.fhir/packages \
          -update || true

    - name: Generate QA report (informational only)
      run: |
        if [ -f output/qa.json ]; then
          echo "=== IG QA SUMMARY (GOLD MODE) ==="

          ERRORS=$(jq '.errs // 0' output/qa.json)
          WARNINGS=$(jq '.warnings // 0' output/qa.json)
          INFO=$(jq '.info // 0' output/qa.json)

          echo "Errors   : $ERRORS"
          echo "Warnings : $WARNINGS"
          echo "Info     : $INFO"

          echo ""
          echo "Top Issues (non-blocking report):"
          jq -r '
            .errorsDetail[]? |
            (.location // "unknown") + " -> " + (.message // "")
          ' output/qa.json | head -50

          echo ""
          echo "Warnings:"
          jq -r '.warningsDetail[]? | "- " + (.message // "")' output/qa.json | head -50
        else
          echo "No QA file generated (still continuing in gold mode)"
        fi

    - name: Upload IG output (Gold build)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ig-gold-output
        path: output

    - name: Upload QA report (Gold mode)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-gold-report
        path: output/qa.json

    - name: Prepare preview publish
      if: github.event_name == 'push'
      run: |
        rm -rf .publish
        mkdir -p .publish/dev/${{ github.sha }}
        rsync -a output/ .publish/dev/${{ github.sha }}/ || true

    - name: Deploy to GitHub Pages (preview)
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: .publish
        keep_files: true
        commit_message: "gold-mode build: ${{ github.sha }}"