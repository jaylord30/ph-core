name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]
#  pull_request:
#    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build & Deploy IG
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "21"
      NODE_VERSION: "20"
      RUBY_VERSION: "3.2"
      IG_PUBLISHER_VERSION: "1.8.6"

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # -----------------------------
      # SETUP ENV
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install dependencies
        run: |
          gem install jekyll bundler
          npm install -g fsh-sushi
          sudo apt-get update
          sudo apt-get install -y graphviz jq

      # -----------------------------
      # CACHE
      # -----------------------------
      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml') }}

      # -----------------------------
      # DOWNLOAD IG PUBLISHER
      # -----------------------------
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/download/${{ env.IG_PUBLISHER_VERSION }}/publisher.jar \
            -o input-cache/publisher.jar
          java -jar input-cache/publisher.jar -v

      # -----------------------------
      # RUN SUSHI
      # -----------------------------
      - name: Run SUSHI
        run: sushi .
      - name: Debug barangay files
        run: |
          echo "=== BARANGAY FILES ==="
          find . -name "*barangay*.xhtml"
      # -----------------------------
      # FIX XHTML INCLUDES (SAFE VERSION)
      # -----------------------------
      - name: Ensure XHTML includes exist
        run: |
          echo "Preparing Jekyll include directory..."
          mkdir -p temp/pages/_includes

          # Copy if exists (SUSHI or IG Publisher generated)
          if [ -d fsh-generated/includes ]; then
            cp -v fsh-generated/includes/*.xhtml temp/pages/_includes/ || true
          fi

          if [ -d fsh-generated/pages/_includes ]; then
            cp -v fsh-generated/pages/_includes/*.xhtml temp/pages/_includes/ || true
          fi

          echo "Available include files:"
          ls -l temp/pages/_includes || true

      # -----------------------------
      # BUILD IG
      # -----------------------------
      - name: Build IG
        run: |
          set -euo pipefail
          java -jar input-cache/publisher.jar \
            publisher -ig . \
            -tx https://tx.fhir.org \
            -generateXHTML

          test -d output || (echo "IG Publisher did not create output/" && exit 1)

      # -----------------------------
      # QA CHECK
      # -----------------------------
      - name: QA validation
        run: |
          if [ -f output/qa.json ]; then
            ERRORS=$(jq '.errs' output/qa.json)
            WARNINGS=$(jq '.warnings' output/qa.json)
            echo "Errors: $ERRORS, Warnings: $WARNINGS"

            if [ "$ERRORS" -ne 0 ]; then
              echo "::error::QA errors found"
              exit 1
            fi
          else
            echo "::warning::No QA report found"
          fi

      # -----------------------------
      # ARTIFACTS
      # -----------------------------
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output

      # -----------------------------
      # PREPARE GH PAGES
      # -----------------------------
      - name: Prepare publish directory
        run: |
          rm -rf .publish
          mkdir -p .publish/dev
          rsync -a output/ .publish/dev/

      - name: Create root index
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>PH Core FHIR IG</title></head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <a href="./dev/">Open Dev Build</a>
          </body>
          </html>
          EOF

      # -----------------------------
      # DEPLOY TO GH PAGES
      # -----------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci: deploy IG ${{ github.sha }}"
