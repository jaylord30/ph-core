name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "21"
      NODE_VERSION: "20"
      RUBY_VERSION: "3.2"
      IG_PUBLISHER_VERSION: "latest"

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/'. Use hyphens instead."
            exit 1
          fi
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters."
            exit 1
          fi
          echo "Branch name validation passed!"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Cache publisher + packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml','**/ig.ini','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-
            ${{ runner.os }}-fhir-core-

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL "https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar" -o input-cache/publisher.jar
          java -jar input-cache/publisher.jar -v || true

      - name: Run SUSHI (FHIR Shorthand)
        run: sushi . --log-level debug

      - name: Regenerate missing _includes fragments
        run: |
          mkdir -p temp/pages/_includes
          REQUIRED_FILES=(
            "StructureDefinition-barangay-sd-use-context.xhtml"
            "StructureDefinition-city-municipality-sd-use-context.xhtml"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f temp/pages/_includes/$f ]; then
              echo "Generating missing include: $f"
              # Attempt auto-generate via SUSHI + IG Publisher
              java -jar input-cache/publisher.jar publisher -ig . -generate-includes
            fi
          done

      - name: Pre-check for required _includes
        run: |
          REQUIRED_FILES=(
            "StructureDefinition-barangay-sd-use-context.xhtml"
            "StructureDefinition-city-municipality-sd-use-context.xhtml"
          )
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f temp/pages/_includes/$f ]; then
              echo "::error::Missing include file: $f"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "::error::One or more required fragments are missing. Failing build."
            exit 1
          fi

      - name: Build IG
        run: |
          set -euo pipefail
          java -jar input-cache/publisher.jar \
            publisher -ig . \
            -tx https://tx.fhir.org \
            -generateXHTML \
            -no-sushi \
            -strict
          test -d output || (echo "IG Publisher did not create output/" && exit 1)

      - name: Fail if output is empty
        run: |
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "::error::IG Publisher did not generate output files."
            exit 1
          fi

      - name: QA gate (fail on errors)
        run: |
          set -euo pipefail
          if [ -f output/qa.json ]; then
            ERRORS=$(jq '.errs' output/qa.json)
            if [ "$ERRORS" -ne 0 ]; then
              echo "::error::QA errors detected: $ERRORS"
              exit 1
            fi
          fi

      - name: Upload IG artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-ig-output
          path: output

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            output/qa.json
            output/qa.html
            output/qa.min.html
          if-no-files-found: warn

      - name: Publish dev build to gh-pages
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev
          rsync -a output/ .publish/dev/
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PH Core FHIR IG</title></head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Open latest dev build</a></p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish dev build from ${{ github.sha }}"