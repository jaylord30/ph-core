name: Build, Test, and Deploy PH Core FHIR IG

on:
#  pull_request:
#    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: True

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  RUBY_VERSION: "3.2"
  IG_PUBLISHER_VERSION: "2.2.5"
  TX_SERVER: "https://tx.fhir.org"


jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains invalid character '/'. Use hyphens instead."
            exit 1
          fi
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters. Avoid: \\ ~ ^ : [ ] spaces"
            exit 1
          fi
          echo "Branch name validation passed!"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Install Jekyll
        run: |
          gem install jekyll bundler
          jekyll -v

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz (for PlantUML)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -v

      - name: Cache publisher + packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml', '**/ig.ini', '**/package-list.json') }}
          restore-keys: |
             ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-
             ${{ runner.os }}-fhir-core-
      
      - name: Clean build folders
        run: |
          rm -rf output temp input-cache

      - name: Run SUSHI
        run: sushi . --log-level info
        
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL "https://github.com/HL7/fhir-ig-publisher/releases/download/${IG_PUBLISHER_VERSION}/publisher.jar" -o "input-cache/publisher.jar"
          java -jar input-cache/publisher.jar -v || true

          ls -lh input-cache

      - name: Preload terminology packages
        run: |
          mkdir -p ~/.fhir/packages

          echo "Using TX server: $TX_SERVER"

          java -jar input-cache/publisher.jar \
            -ig . \
            -tx ${TX_SERVER} \
            -cachedir ~/.fhir/packages \
            -update 

      - name: Build IG
        run: |
          java -jar input-cache/publisher.jar \
            -ig . \
            -tx ${TX_SERVER} \
            -cachedir ~/.fhir/packages \
            -update \
            -reset
          test -d output || (echo "::error::No output folder generated" && exit 1)
          test -f output/package.tgz || echo "::warning::No IG package generated"

      - name: QA gate
        run: |
          set -euo pipefail

          if [ ! -f output/qa.json ]; then
            echo "::error::qa.json not found"
            exit 1
          fi

          ERRORS=$(jq '.errs // 0' output/qa.json)
          WARNINGS=$(jq '.warnings // 0' output/qa.json)
          INFO=$(jq '.info // 0' output/qa.json)

          echo "FHIR IG QA SUMMARY"
          echo "Errors   : $ERRORS"
          echo "Warnings : $WARNINGS"
          echo "Info     : $INFO"

          echo ""
          echo "TOP ERROR SOURCES"
          jq -r '.errorsDetail[]?.location // "unknown"' output/qa.json \
            | sort | uniq -c | sort -nr | head -20

          echo ""
          echo "DETAILED ERRORS"
          jq -r '
            .errorsDetail[]? |
            "Location: " + (.location // "unknown") + "\n" +
            "Message : " + (.message // "no message") + "\n---"
          ' output/qa.json

          echo ""
          echo "WARNINGS"
          jq -r '.warningsDetail[]? | "- " + (.message // "no message")' output/qa.json

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::FHIR IG failed with $ERRORS errors"
            exit 1
          fi

          echo "QA PASSED (warnings allowed)"

      - name: Upload IG artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-ig-output
          path: output

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: output/qa.json

      - name: Prepare publish directory 
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev/${{ github.sha }}
          rsync -a output/ .publish/dev/${{ github.sha }}/

      - name: Create root index.html
        if: github.event_name == 'push'
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PH Core FHIR IG</title>
          </head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Open latest dev build</a></p>
          </body>
          </html>
          EOF

      - name: Publish to gh-pages:/dev/
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish dev build from ${{ github.sha }}"