name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  RUBY_VERSION: "3.2"
  IG_PUBLISHER_VERSION: "2.2.5"
  TX_SERVER: "https://tx.fhir.org"

jobs:
  build:
    name: IG Build 
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Install Jekyll
      run: |
          gem install jekyll bundler
          jekyll -v

    - name: Install SUSHI
      run: npm install -g fsh-sushi

    - name: Download IG Publisher
      run: |
        mkdir -p input-cache
        curl -fsSL \
          https://github.com/HL7/fhir-ig-publisher/releases/download/${IG_PUBLISHER_VERSION}/publisher.jar \
          -o input-cache/publisher.jar


    - name: Clean build folders
      run: |
        rm -rf output temp
        mkdir -p ~/.fhir/packages


    - name: Run SUSHI
      run: sushi . --log-level info


    - name: Build IG
      run: |
        java -jar input-cache/publisher.jar \
          -ig . \
          -tx $TX_SERVER \
          -cachedir ~/.fhir/packages \
          -update

    - name: Check output exists
      run: |
        if [ ! -d output ]; then
          echo "::error::IG build failed - no output folder"
          exit 1
        fi


    - name: Generate QA report
      run: |
        if [ ! -f output/qa.json ]; then
          echo "::error::qa.json not found"
          exit 1
        fi

        ERRORS=$(jq '.errs // 0' output/qa.json)
        WARNINGS=$(jq '.warnings // 0' output/qa.json)
        INFO=$(jq '.info // 0' output/qa.json)

        echo "=== IG QA SUMMARY ==="
        echo "Errors   : $ERRORS"
        echo "Warnings : $WARNINGS"
        echo "Info     : $INFO"

        echo ""
        echo "Top Errors:"
        jq -r '
          .errorsDetail[]? |
          (.location // "unknown") + " -> " + (.message // "")
        ' output/qa.json | head -50

    - name: Upload IG output
      uses: actions/upload-artifact@v4
      with:
        name: ig-output
        path: output

    - name: Upload QA JSON
      uses: actions/upload-artifact@v4
      with:
        name: qa-report
        path: output/qa.json

    - name: Upload QA HTML
      uses: actions/upload-artifact@v4
      with:
        name: qa-html
        path: output/qa.html


    - name: Prepare preview publish
      if: github.event_name == 'push'
      run: |
        rm -rf .publish
        mkdir -p .publish/dev/${{ github.sha }}
        rsync -a output/ .publish/dev/${{ github.sha }}/

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: .publish
        keep_files: true
        commit_message: "ci(dev): publish dev build from ${{ github.sha }}"