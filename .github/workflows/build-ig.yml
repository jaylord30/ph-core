name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "21"
      NODE_VERSION: "20"
      RUBY_VERSION: "3.2"
      IG_PUBLISHER_VERSION: "1.8.6"

    steps:
      # --- 1. Validate branch name ---
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains invalid character '/'. Use hyphens instead."
            exit 1
          fi
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters. Avoid: \\ ~ ^ : [ ] spaces"
            exit 1
          fi
          echo "Branch name validation passed!"

      # --- 2. Checkout repository ---
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- 3. Setup Java, Node, Ruby ---
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz (for PlantUML)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -v

      # --- 4. Cache publisher and FHIR packages ---
      - name: Cache publisher + packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml', '**/ig.ini', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-
            ${{ runner.os }}-fhir-core-

      # --- 5. Download IG Publisher ---
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL "https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar" -o "input-cache/publisher.jar"
          java -jar input-cache/publisher.jar -v || true

      # --- 6. Preload FHIR terminology packages ---
      - name: Fetch FHIR terminology packages
        run: |
          sushi . --update-packages

      # --- 7. Run SUSHI ---
      - name: Run SUSHI
        run: sushi . --log-level debug

      # --- 8. Build IG ---
      - name: Build IG
        run: |
          java -jar input-cache/publisher.jar -ig .
          test -d output || (echo "IG Publisher did not create output/" && exit 1)

      # --- 9. Fail if output is empty ---
      - name: Fail if output is empty
        run: |
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "IG Publisher did not generate output files."
            exit 1
          fi

      # --- 10. QA Gate ---
      - name: QA gate
        run: |
          set -euo pipefail
          if [ -f output/qa.json ]; then
            ERRORS=$(jq '.errs' output/qa.json || echo 0)
            echo "QA Errors: $ERRORS"
            if [ "$ERRORS" != "0" ]; then
              echo "::error::QA errors found in qa.json (count=$ERRORS)"
              exit 1
            fi
          elif [ -f output/qa.html ]; then
            QA_LINE=$(grep -oP 'Errors:\s*\d+,\s*Warnings:\s*\d+,\s*Info:\s*\d+' output/qa.html | head -1 || echo "")
            ERRORS=$(echo "$QA_LINE" | grep -oP 'Errors:\s*\K[0-9]+' || echo 0)
            if [ "$ERRORS" != "0" ]; then
              echo "::error::QA errors found in qa.html (count=$ERRORS)"
              exit 1
            fi
          else
            echo "::error::No qa.json or qa.html found in output/. Failing for safety."
            exit 1
          fi
          echo "QA passed (errors=0)"

      # --- 11. Upload artifacts ---
      - name: Upload IG artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-ig-output
          path: output

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            output/qa.json
            output/qa.html
            output/qa.min.html
          if-no-files-found: warn

      # --- 12. Prepare publish directory ---
      - name: Prepare publish directory (dev)
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev
          rsync -a output/ .publish/dev/

      - name: Create root index.html
        if: github.event_name == 'push'
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PH Core FHIR IG</title>
          </head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Open latest dev build</a></p>
          </body>
          </html>
          EOF

      # --- 13. Publish to gh-pages ---
      - name: Publish to gh-pages:/dev/
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish dev build from ${{ github.sha }}"