name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "21"
      NODE_VERSION: "20"
      RUBY_VERSION: "3.2"
      IG_PUBLISHER_VERSION: "1.8.6"

    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Checking branch name: $BRANCH_NAME"
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/'. Use '-' instead."
            exit 1
          fi
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters."
            exit 1
          fi
          echo "Branch name validation passed!"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Jekyll and Bundler
        run: gem install jekyll bundler

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Cache publisher + FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml','**/ig.ini','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-
            ${{ runner.os }}-fhir-core-

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL https://github.com/HL7/fhir-ig-publisher/releases/download/${{ env.IG_PUBLISHER_VERSION }}/publisher.jar -o input-cache/publisher.jar
          java -jar input-cache/publisher.jar -v || true

      - name: Run SUSHI to generate FHIR resources
        run: sushi . --log-level debug

      - name: Copy SUSHI-generated _includes for Jekyll
        run: |
          echo "Ensuring SUSHI XHTML fragments exist for Jekyll"
          mkdir -p temp/pages/_includes
          if [ -d fsh-generated/pages/_includes ]; then
            cp -v fsh-generated/pages/_includes/*.xhtml temp/pages/_includes/ || true
          else
            echo "::error::No SUSHI-generated include fragments found! Check fsh-generated/pages/_includes/"
            exit 1
          fi
          ls -l temp/pages/_includes

      - name: Build IG with Publisher
        run: |
          set -euo pipefail
          java -jar input-cache/publisher.jar publisher -ig . -tx https://tx.fhir.org -generateXHTML
          test -d output || (echo "IG Publisher did not create output/" && exit 1)

      - name: Fail if output is empty
        run: |
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "::error::IG Publisher did not generate output files."
            exit 1
          fi

      - name: QA gate (errors only)
        run: |
          if [ -f output/qa.json ]; then
            ERRORS=$(jq '.errs' output/qa.json)
            WARNINGS=$(jq '.warnings' output/qa.json)
            HINTS=$(jq '.hints' output/qa.json)
            echo "QA Report - Errors: $ERRORS, Warnings: $WARNINGS, Hints: $HINTS"
            if [ "$ERRORS" -ne 0 ]; then
              echo "::error::QA errors detected ($ERRORS errors). See full log in output/qa.json"
              exit 1
            fi
          else
            echo "::warning::No QA report found. Skipping QA error check."
          fi

      - name: Upload IG artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-ig-output
          path: output

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            output/qa.json
            output/qa.html
            output/qa.min.html
          if-no-files-found: warn

      - name: Prepare publish directory
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev
          rsync -a output/ .publish/dev/

      - name: Create root index.html
        if: github.event_name == 'push'
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PH Core FHIR IG</title>
          </head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Open latest dev build</a></p>
          </body>
          </html>
          EOF

      - name: Publish to gh-pages:/dev/
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish dev build from ${{ github.sha }}"