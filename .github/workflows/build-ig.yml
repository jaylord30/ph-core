name: Build, Test, and Deploy PH Core FHIR IG

on:
#  push:
#    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "21"
      NODE_VERSION: "20"
      RUBY_VERSION: "3.2"
      IG_PUBLISHER_VERSION: "1.8.5" # use latest to avoid Jekyll missing include errors

    steps:
      # --- Branch validation ---
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/'. Use '-' instead."
            exit 1
          fi
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters."
            exit 1
          fi
          echo "Branch name validation passed!"

      # --- Checkout and environment setup ---
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Jekyll and Bundler
        run: gem install jekyll bundler

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      # --- Cache publisher + FHIR packages ---
      - name: Cache publisher + packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml', '**/ig.ini', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-fhir-core-${{ env.IG_PUBLISHER_VERSION }}-
            ${{ runner.os }}-fhir-core-

      # --- Download IG Publisher ---
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL "https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar" -o input-cache/publisher.jar
          java -jar input-cache/publisher.jar -v || true

      # --- Clean old output (but NOT _includes) and run SUSHI ---
      - name: Clean output and run SUSHI
        run: |
          rm -rf output
          sushi . --log-level debug

      # --- Build IG with Publisher ---
      - name: Build IG
        run: |
          java -jar input-cache/publisher.jar \
            publisher -ig . \
            -tx https://tx.fhir.org \
            -generateXHTML \
            -no-sushi \
            -strict
          test -d output || (echo "IG Publisher did not create output/" && exit 1)

      # --- Fail if output empty ---
      - name: Fail if output is empty
        run: |
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "::error::IG Publisher did not generate output files."
            exit 1
          fi

      # --- QA Gate ---
      - name: QA gate
        run: |
          set -euo pipefail
          if [ -f output/qa.json ]; then
            ERRORS=$(jq '.errs' output/qa.json)
            WARNINGS=$(jq '.warnings' output/qa.json)
          elif [ -f output/qa.html ]; then
            ERRORS=$(grep -oP 'Errors:\s*\K\d+' output/qa.html || echo 0)
            WARNINGS=$(grep -oP 'Warnings:\s*\K\d+' output/qa.html || echo 0)
          else
            echo "::error::No QA report found (qa.json or qa.html)."
            exit 1
          fi

          echo "QA Report - Errors: $ERRORS, Warnings: $WARNINGS"
          if [ "$ERRORS" -ne 0 ]; then
            echo "::error::QA errors detected. Failing build."
            exit 1
          fi
          if [ "$WARNINGS" -ne 0 ]; then
            echo "::warning::QA warnings detected."
          fi

      # --- Upload artifacts ---
      - name: Upload IG artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-ig-output
          path: output

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            output/qa.json
            output/qa.html
            output/qa.min.html
          if-no-files-found: warn

      # --- Prepare and publish GH Pages ---
      - name: Prepare publish directory
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev
          rsync -a output/ .publish/dev/

      - name: Create root index.html
        if: github.event_name == 'push'
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PH Core FHIR IG</title>
          </head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Open latest dev build</a></p>
          </body>
          </html>
          EOF

      - name: Publish to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish dev build from ${{ github.sha }}"