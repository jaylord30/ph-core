name: Build, Test, and Deploy PH Core FHIR IG

on:
#  pull_request:
#    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  RUBY_VERSION: "3.2"
  IG_PUBLISHER_VERSION: "2.2.5"
  TX_SERVER: "https://tx.fhir.org"

jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"

          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/' - use hyphens instead"
            exit 1
          fi

          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Invalid branch name characters detected"
            exit 1
          fi

          echo "Branch name OK"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Install Jekyll
        run: |
          gem install jekyll bundler
          jekyll -v

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -v

      - name: Cache IG Publisher + packages
        uses: actions/cache@v4
        with:
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-${{ env.IG_PUBLISHER_VERSION }}-${{ hashFiles('**/sushi-config.yaml', '**/ig.ini', '**/package-list.json') }}
          restore-keys: |
            ${{ runner.os }}-fhir-${{ env.IG_PUBLISHER_VERSION }}-

      - name: Clean build folders
        run: |
          rm -rf output temp input-cache ~/.fhir/packages

      - name: Run SUSHI
        run: sushi . --log-level info

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL "https://github.com/HL7/fhir-ig-publisher/releases/download/${IG_PUBLISHER_VERSION}/publisher.jar" \
            -o input-cache/publisher.jar

          java -jar input-cache/publisher.jar -v || true

      - name: Preload terminology packages
        run: |
          mkdir -p ~/.fhir/packages

          java -jar input-cache/publisher.jar \
            -ig . \
            -tx ${TX_SERVER} \
            -cachedir ~/.fhir/packages \
            -update

      - name: Build IG
        run: |
          set -e

          java -Xmx6g -jar input-cache/publisher.jar \
            -ig . \
            -tx ${TX_SERVER} \
            -cachedir ~/.fhir/packages \
            -update \
            -reset 

          echo "================ BUILD DONE ================"

      - name: Show QA summary
        if: always()
        run: |
          if [ -f output/qa.json ]; then
            echo "==== QA SUMMARY ===="
            cat output/qa.json | jq .

            echo ""
            echo "==== ERROR COUNT ===="
            jq '.errs' output/qa.json
          else
            echo "::warning::qa.json not found"
          fi

      - name: Generate QA Error Report (DOWNLOADABLE)
        if: always()
        run: |
          mkdir -p qa-report

          echo "FHIR IG QA ERROR REPORT" > qa-report/qa-errors.txt
          echo "Generated: $(date)" >> qa-report/qa-errors.txt
          echo "=====================================" >> qa-report/qa-errors.txt
          echo "" >> qa-report/qa-errors.txt

          if [ -f output/qa.json ]; then
            echo "TOTAL ERRORS: $(jq '.errs' output/qa.json)" >> qa-report/qa-errors.txt
            echo "" >> qa-report/qa-errors.txt
            echo "===== ERROR DETAILS =====" >> qa-report/qa-errors.txt

            jq -r '
              .errorsDetail[]? |
              "LOCATION: " + (.location // "unknown") + "\n" +
              "MESSAGE : " + (.message // "") + "\n" +
              "----------------------------------------"
            ' output/qa.json >> qa-report/qa-errors.txt

          else
            echo "qa.json not found" >> qa-report/qa-errors.txt
          fi

      - name: Upload IG output
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: output/qa.json

      - name: Upload QA HTML 
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-html
          path: output/qa.html

      # - name: Fail build if IG has errors
      #   run: |
      #     if [ -f output/qa.json ]; then
      #       ERRORS=$(jq '.errs // 0' output/qa.json)

      #       if [ "$ERRORS" -gt 0 ]; then
      #         echo "::error::FHIR IG failed with $ERRORS errors"
      #         exit 1
      #       fi
      #     fi
      - name: Prepare publish directory
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev/${{ github.sha }}
          rsync -a output/ .publish/dev/${{ github.sha }}/

      - name: Create index page
        if: github.event_name == 'push'
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>PH Core FHIR IG</title>
          </head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Open latest dev build</a></p>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish build ${{ github.sha }}"