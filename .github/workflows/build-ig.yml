name: Build, Test, and Deploy PH Core FHIR IG

on:
  push:
    branches: ["main"]
# pull_request:
    #branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fhir-ig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: True

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  RUBY_VERSION: "3.2"
  IG_PUBLISHER_VERSION: "1.8.6"
  TX_SERVER: "https://tx.fhir.org"
  JAVA_TOOL_OPTION: "-Xmx6g"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI - Build & QA (Core IG)
    runs-on: ubuntu-latest
    timeout-minutes: 60

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Install Graphviz (for PlantUML)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -v

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${IG_PUBLISHER_VERSION}/publisher.jar" \
            -o input-cache/publisher.jar

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with
          path: |
            input-cache
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-${{ hashFiles('**/sushi-config.yaml', '**/ig.ini') }}

      - name: Run SUSHI
        run: sushi . --log-level info

      - name: Build IG
        run: |
          java -jar input-cache/publisher.jar \
            -ig . \
            -tx ${TX_SERVER} \
            -cachedir ~/.fhir/packages \
            -update \
            -reset
          test -d output || (echo "::error::No output folder generated" && exit 1)

      - name: QA gate
        run: |
          set -euo pipefail

          if [ -f output/qa.json ]; then
            ERRORS=$(jq '.errs' output/qa.json)
            echo "QA Errors: $ERRORS"

            if [ "$ERRORS" != "0" ]; then
              echo "::error::QA failed with $ERRORS errors"
              exit 1
            fi
          else
            echo "::error::qa.json not found"
            exit 1
          fi
          echo "QA passed (0 errors)"

      - name: Upload IG artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-ig-output
          path: output

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: output/qa.*

      - name: Prepare publish directory 
        if: github.event_name == 'push'
        run: |
          rm -rf .publish
          mkdir -p .publish/dev
          rsync -a output/ .publish/dev/

      - name: Create root index.html (dev + future versions ready)
        if: github.event_name == 'push'
        run: |
          cat > .publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PH Core FHIR IG</title>
          </head>
          <body>
            <h1>PH Core FHIR IG</h1>
            <p><a href="./dev/">Latest Dev Build</a></p>
          </body>
          </html>
          EOF

      - name: Publish to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .publish
          keep_files: true
          commit_message: "ci(dev): publish IG build ${{ github.sha }}"