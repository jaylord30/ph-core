name: Release PROD IG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ig-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: |
          npm install -g fsh-sushi
          gem install jekyll bundler
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fsSL \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Build IG
        run: |
          sushi .
          java -jar input-cache/publisher.jar ig.ini

      - name: Clone gh-pages
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            .gh-pages || {
              mkdir .gh-pages
              cd .gh-pages
              git init
              git checkout -b gh-pages
              git remote add origin \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            }

      - name: Publish version
        run: |
          VERSION=${{ steps.v.outputs.version }}
          mkdir -p ".gh-pages/$VERSION"
          rsync -a output/ ".gh-pages/$VERSION/"

      - name: Update /current
        run: |
          VERSION=${{ steps.v.outputs.version }}

          mkdir -p ".gh-pages/current"

          cat > ".gh-pages/current/index.html" <<EOF
          <html><meta http-equiv="refresh" content="0; url=../$VERSION/"></html>
          EOF

      - name: Update rollback registry
        run: |
          FILE=".gh-pages/rollback.json"

          if [ ! -f "$FILE" ]; then
            echo "[]" > $FILE
          fi

          jq ". += [{version: \"${{ steps.v.outputs.version }}\", date: \"$(date -Iseconds)\"}]" $FILE > tmp.json
          mv tmp.json $FILE

      - name: Commit gh-pages
        run: |
          cd .gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Release ${{ steps.v.outputs.version }}" || exit 0
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "FHIR IG ${{ steps.v.outputs.version }}"
          files: output/**

      - name: Mirror to GitLab
        run: |
          cd .gh-pages

          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git remote add gitlab https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@${{ secrets.GITLAB_REPO }}

          git add -A
          git commit -m "Mirror release ${{ github.ref_name }}" || echo "No changes"

          git branch -M gh-pages
          git push gitlab gh-pages --force